<div class="page-container">
    @if (authService.currentUser()) {
    <div class="profile-card">
        <a routerLink="/characters" class="btn btn-outline-secondary mb-4">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="row">
            <div class="col-md-4">
                <img [src]="authService.currentUser()!.avatar" [alt]="authService.currentUser()!.name"
                    class="profile-image">
            </div>
            <div class="col-md-8">
                <h1 class="profile-name">{{ authService.currentUser()!.name }}</h1>

                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Name</span>
                        <span class="info-value">{{ authService.currentUser()!.name }}</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Email</span>
                        <span class="info-value">{{ authService.currentUser()!.email }}</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">User ID</span>
                        <span class="info-value">{{ authService.currentUser()!.id }}</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Status</span>
                        <span class="badge bg-success">Active</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Role</span>
                        <span class="info-value">Administrator</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label">Member Since</span>
                        <span class="info-value">{{ getCurrentDate() }}</span>
                    </div>
                </div>

                <div class="mt-4">
                    <button class="btn btn-primary me-2">
                        <i class="bi bi-pencil"></i> Edit Profile
                    </button>
                    <button class="btn btn-outline-danger" (click)="authService.logout()">
                        <i class="bi bi-box-arrow-right"></i> Sign Out
                    </button>
                </div>
            </div>
        </div>
    </div>
    }
</div>
