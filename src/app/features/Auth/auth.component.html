<div class="container">
    <div class="login-container">
        <div class="text-center mb-4">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Rick_and_Morty.svg" alt="Rick and Morty"
                class="logo">
            <h2 class="mt-3">Welcome Back</h2>
            <p class="text-muted">Sign in to access the dashboard</p>
        </div>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email" required
                    placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password"
                    required placeholder="Enter your password">
            </div>

            @if (errorMessage()) {
            <div class="alert alert-danger" role="alert">
                {{ errorMessage() }}
            </div>
            }

            <button type="submit" class="btn btn-primary w-100" [disabled]="!loginForm.valid">
                Sign In
            </button>
        </form>

        <div class="mt-3 text-center">
            <small class="text-muted">Use any email and password to login</small>
        </div>
    </div>
</div>
