<div>
  <div>
    <i class="bi bi-search search-icon"></i>
    <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange($event)">
    @if (searchTerm) {
    <button class="btn-clear" (click)="clearSearch()">
      <i class="bi bi-x"></i>
    </button>
    }
  </div>
</div>
